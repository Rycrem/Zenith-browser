name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier la syntaxe
        run: for f in src/main/*.js src/shared/*.js src/renderer/*.js scripts/*.js; do node --check "$f"; done
