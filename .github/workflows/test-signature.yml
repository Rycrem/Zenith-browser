# Temporaire : teste la signature Certum à chaque push sur la branche de la PR, sans rien publier.
# À retirer avant de merger.
name: Test signature

on:
  push:
    branches: [claude/project-thread-vfee8k]

jobs:
  sign:
    runs-on: windows-latest
    env:
      CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier les secrets
        shell: bash
        run: |
          [ -n "$CERTUM_USERNAME" ] || { echo "::error::secret CERTUM_USERNAME absent"; exit 1; }
      - run: npm ci
      - name: Télécharger uBlock Origin
        run: node scripts/fetch-ublock.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Se connecter à SimplySign (certificat Certum)
        id: certum
        run: node scripts/certum-login.js
        env:
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
      - name: Construire sans publier
        run: npx electron-builder --win --publish never -c.win.signtoolOptions.certificateSha1=${{ steps.certum.outputs.thumbprint }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Vérifier les signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist\*.exe) + @(Get-ChildItem dist\win-unpacked -Recurse -Include *.exe,*.dll)
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($s.Status)  $($f.Name)  $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { Write-Error "$bad fichier(s) non signé(s)"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-signe
          path: dist/*.exe
          retention-days: 3
