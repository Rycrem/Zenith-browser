# Construit les installateurs Windows, macOS et Linux et les publie dans une Release GitHub.
# Se lance en poussant un tag vX.Y.Z (égal à la version de package.json), ou à la main
# depuis l'onglet Actions. L'appli installée détecte ensuite la nouvelle Release avec « update ».
name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Lire la version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à la version de package.json ($tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Créer la Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::la Release $TAG existe déjà : augmente la version dans package.json"
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "dev-brows $TAG" --generate-notes

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Télécharger uBlock Origin (livré préinstallé)
        run: node scripts/fetch-ublock.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Construire et envoyer les installateurs
        shell: bash
        run: |
          # Signature Azure Artifact Signing quand les secrets AZURE_* sont configurés,
          # sinon installateur non signé (bloqué par Smart App Control sous Windows 11).
          args=()
          if [ -n "$AZURE_CLIENT_ID" ]; then
            args+=(
              -c.win.azureSignOptions.publisherName="$AZURE_PUBLISHER"
              -c.win.azureSignOptions.endpoint="$AZURE_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_PROFILE"
            )
          else
            echo "::warning::pas de secrets AZURE_* : installateur Windows non signé"
          fi
          npx electron-builder --publish always "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_PROFILE }}
          AZURE_PUBLISHER: ${{ vars.AZURE_PUBLISHER }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
