# Construit seulement l'installateur Windows (.exe) et le publie dans une Release GitHub.
# Se lance à la main depuis l'onglet Actions. Plus rapide que « Installateurs », mais les
# appli macOS et Linux installées ne trouveront pas de mise à jour dans cette Release.
name: Installateur Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Lire la version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Créer la Release en brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::la Release $TAG existe déjà : augmente la version dans package.json"
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "dev-brows $TAG" --generate-notes
      - run: npm ci
      - run: npm test
      - name: Télécharger uBlock Origin (livré préinstallé)
        run: node scripts/fetch-ublock.js
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Construire et envoyer l'installateur
        shell: bash
        run: |
          # Signature Azure Artifact Signing quand les secrets AZURE_* sont configurés,
          # sinon installateur non signé (bloqué par Smart App Control sous Windows 11).
          args=()
          if [ -n "$AZURE_CLIENT_ID" ]; then
            args+=(
              -c.win.azureSignOptions.publisherName="$AZURE_PUBLISHER"
              -c.win.azureSignOptions.endpoint="$AZURE_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_PROFILE"
            )
          else
            echo "::warning::pas de secrets AZURE_* : installateur non signé"
          fi
          npx electron-builder --win --publish always "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_PROFILE }}
          AZURE_PUBLISHER: ${{ vars.AZURE_PUBLISHER }}
      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
