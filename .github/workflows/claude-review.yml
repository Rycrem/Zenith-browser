name: Revue Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Une nouvelle poussée annule la revue en cours de la même PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Un seul des deux secrets suffit (clé API ou jeton d'abonnement Claude).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            DÉPÔT : ${{ github.repository }}
            PR : ${{ github.event.pull_request.number }}
            ÉVÉNEMENT : ${{ github.event.action }}
            AVANT : ${{ github.event.before }}
            APRÈS : ${{ github.event.pull_request.head.sha }}

            Relis cette PR de Zenith (navigateur Electron piloté depuis un terminal, voir CLAUDE.md
            et README.fr.md pour l'architecture).

            Quoi relire :
            - Si ÉVÉNEMENT vaut `synchronize` et que AVANT existe dans l'historique, relis seulement
              `git diff AVANT APRÈS`, limité aux fichiers de `gh pr diff --name-only`. Ce qui vient
              d'un merge de main n'est pas à relire.
            - Sinon, relis `gh pr diff`.
            - Lis d'abord les retours déjà postés (`gh pr view --comments` et
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`).
              Ne répète jamais un point déjà signalé, qu'il ait été corrigé ou que l'auteur ait
              répondu pourquoi il le garde.

            Quoi signaler : uniquement les problèmes bloquants.
            - Justesse : un bug réel (plantage, mauvais résultat, état bloqué).
            - Régression : un comportement existant cassé.
            - Sécurité : faille exploitable (API exposée aux sites, preload, IPC, navigation privée,
              confirmation contournable).
            Pas de remarques d'optimisation, de style, de nommage ni de cas théoriques.

            Avant de signaler un problème, prouve-le dans le code réel : suis l'appel jusqu'au bout,
            y compris dans node_modules quand une bibliothèque est en jeu, et décris le scénario
            concret qui le déclenche. Si tu ne peux pas le prouver, ne le signale pas.
            Les tests tournent dans un autre job de la CI : n'en parle pas.

            Comment répondre, en français, court et concret :
            - Chaque problème : commentaire en ligne avec
              mcp__github_inline_comment__create_inline_comment (confirmed: true) : le problème,
              le scénario, la correction.
            - Puis un seul commentaire de synthèse avec `gh pr comment`.
              S'il n'y a rien de bloquant, écris seulement « Rien à signaler. » et rien d'autre.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git cat-file:*)"
