name: Revue Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Une nouvelle poussée annule la revue en cours de la même PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Un seul des deux secrets suffit (clé API ou jeton d'abonnement Claude).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            DÉPÔT : ${{ github.repository }}
            PR : ${{ github.event.pull_request.number }}

            Relis cette PR de Zenith (navigateur Electron piloté depuis un terminal, voir CLAUDE.md
            et README.fr.md pour l'architecture). Lis `gh pr diff` puis le code autour des changements.

            Cherche, par ordre d'importance :
            1. Justesse : bugs, cas limites, erreurs non gérées, IPC ou API exposée aux sites
               (preload, liste blanche, contextIsolation), fuite de données en navigation privée.
            2. Régressions : comportement existant cassé (commandes du terminal, raccourcis, onglets,
               split, extensions, mises à jour), ou incohérence avec le reste du code.
            3. Optimisation : travail inutile dans le processus principal, écouteurs ou timers non
               libérés, écritures disque répétées, code plus simple possible.
            Vérifie aussi les règles du dépôt : version montée dans package.json, entrée fr/en en tête
            de src/shared/changelog.js, nouvelles phrases traduites dans src/shared/i18n.js,
            commandes documentées dans README.md et README.fr.md, test si la logique est dans src/shared/.

            Retours en français, courts et concrets : le problème, pourquoi, la correction.
            Pas de compliments, pas de remarques de style sans conséquence.
            - Un problème précis sur une ligne : commentaire en ligne avec
              mcp__github_inline_comment__create_inline_comment (confirmed: true).
            - Puis un seul commentaire de synthèse avec `gh pr comment` : verdict (prête / à corriger),
              liste des points bloquants. Si rien à signaler, dis-le en une ligne.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
