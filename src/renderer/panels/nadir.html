<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Nadir</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="pop" class="nadir">
    <header>
      <span class="sign">✦</span> <span id="title"></span>
      <span class="grow"></span>
      <select id="level"></select>
      <button id="reset" type="button">⟲</button>
      <button id="close" type="button">✕</button>
    </header>
    <div id="chat"></div>
    <div id="status" hidden><span id="status-text"></span><span class="bar"><span id="bar"></span></span><button id="stop" type="button">■</button></div>
    <form id="ask" autocomplete="off">
      <textarea id="input" rows="2" spellcheck="false" autofocus></textarea>
    </form>
    <footer><span id="memory"></span><span id="hint"></span></footer>
  </div>
  <script src="common.js"></script>
  <script src="nadir.js"></script>
</body>
</html>
