<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Zenith</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="pop">
    <header><span class="sign">❯</span> <span id="title"></span></header>
    <div id="rows"></div>
    <form id="custom" class="custom" autocomplete="off">
      <div id="custom-title" class="dim"></div>
      <div class="fields">
        <input id="w" type="number" min="200" max="4000" required>
        <span class="dim">×</span>
        <input id="h" type="number" min="200" max="4000" required>
        <button type="submit" id="apply"></button>
      </div>
      <div class="fields">
        <input id="name" type="text" maxlength="40">
        <button type="button" id="save"></button>
      </div>
    </form>
    <footer><span id="hint"></span></footer>
  </div>
  <script src="mobile.js"></script>
</body>
</html>
