<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Zenith</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="tabbar">
      <span class="logo">Zenith</span>
      <div id="tabs">
        <div class="tab-group" data-pane="0">
          <nav class="tab-strip" aria-label="Onglets"></nav>
          <button class="new-tab" type="button" aria-label="Nouvel onglet" title="Nouvel onglet (Ctrl+T)">+</button>
          <span class="tab-nav">
            <button class="tab-prev" type="button" aria-label="Page précédente" title="Page précédente (Alt+←)">‹</button>
            <button class="tab-next" type="button" aria-label="Page suivante" title="Page suivante (Alt+→)">›</button>
          </span>
        </div>
        <div class="tab-sep"></div>
        <div class="tab-group" data-pane="1">
          <nav class="tab-strip" aria-label="Onglets"></nav>
          <button class="new-tab" type="button" aria-label="Nouvel onglet" title="Nouvel onglet (Ctrl+T)">+</button>
          <span class="tab-nav">
            <button class="tab-prev" type="button" aria-label="Page précédente" title="Page précédente (Alt+←)">‹</button>
            <button class="tab-next" type="button" aria-label="Page suivante" title="Page suivante (Alt+→)">›</button>
          </span>
        </div>
      </div>
      <form id="url-form" class="url" autocomplete="off">
        <button id="url-reload" type="button" title="Recharger (F5)" aria-label="Recharger"></button>
        <input id="url" spellcheck="false" title="Modifier l'adresse (Entrée pour y aller)">
        <span id="copied" hidden>copié</span>
        <button id="url-fav" type="button" title="Ajouter aux favoris" aria-label="Ajouter aux favoris">☆</button>
        <button id="url-copy" type="button" title="Copier l'adresse" aria-label="Copier l'adresse"></button>
      </form>
    </header>
    <main id="content">
      <section class="pane" data-pane="0">
        <div class="pane-bar"></div>
        <div class="viewport"><div class="screen"></div></div>
      </section>
      <div class="pane-resizer" role="separator" aria-orientation="vertical" title="Glisser pour redimensionner"></div>
      <section class="pane" data-pane="1">
        <div class="pane-bar"></div>
        <div class="viewport"><div class="screen"></div></div>
      </section>
    </main>
    <div id="resizer" role="separator" aria-orientation="horizontal" title="Glisser pour redimensionner le terminal (double-clic : taille par défaut)"></div>
    <section id="terminal">
      <div class="term-col" data-pane="0">
        <div class="scrollback" aria-live="polite"></div>
        <form class="prompt" autocomplete="off">
          <label class="ps1"></label>
          <textarea class="input" rows="1" spellcheck="false" autofocus></textarea>
        </form>
      </div>
      <div class="term-sep"></div>
      <div class="term-col" data-pane="1">
        <div class="scrollback" aria-live="polite"></div>
        <form class="prompt" autocomplete="off">
          <label class="ps1"></label>
          <textarea class="input" rows="1" spellcheck="false"></textarea>
        </form>
      </div>
    </section>
    <footer id="status"></footer>
  </div>
  <script src="../shared/i18n.js"></script>
  <!-- Scripts classiques qui partagent leurs déclarations. L'ordre compte : les fonctions d'abord,
       puis ce qui réagit au processus principal et à la taille de la fenêtre, et start.js en dernier. -->
  <script src="core/base.js"></script>
  <script src="core/icons.js"></script>
  <script src="terminal/output.js"></script>
  <script src="tabs/tab-bar.js"></script>
  <script src="status-bar/player.js"></script>
  <script src="status-bar/status-bar.js"></script>
  <script src="screens/screens.js"></script>
  <script src="search/find-in-screen.js"></script>
  <script src="core/labels.js"></script>
  <script src="layout/resizers.js"></script>
  <script src="address-bar/address-bar.js"></script>
  <script src="terminal/input.js"></script>
  <script src="core/on-state.js"></script>
  <script src="core/start.js"></script>
</body>
</html>
